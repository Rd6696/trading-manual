<g font-family="Arial, sans-serif">
<text x="828" y="108" fill="#76d9d4" font-size="13" letter-spacing="2">01 / 02</text>
<text x="960" y="108" fill="#e1eaf6" font-size="20">LEARN</text>
<text x="828" y="172" fill="#86bbf0" font-size="13" letter-spacing="2">03 / 04</text>
